<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pierre-review</title>
  <style>
    :root { color-scheme: dark; --bar: 46px; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0d1117; color: #c9d1d9;
           font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
    #bar { position: sticky; top: 0; z-index: 20; display: flex; gap: 12px; align-items: center;
           height: var(--bar); padding: 0 14px; background: #161b22; border-bottom: 1px solid #30363d; }
    #bar h1 { font-size: 14px; margin: 0; font-weight: 600; color: #e6edf3; }
    #meta { color: #8b949e; font-size: 12px; }
    .sp { flex: 1; }
    #toggle { padding: 5px 10px; border: 1px solid #30363d; border-radius: 6px;
              background: #21262d; color: #c9d1d9; cursor: pointer; font: 600 12px system-ui; }
    #layout { display: flex; align-items: flex-start; }
    #sidebar { position: sticky; top: var(--bar); width: 280px; flex: 0 0 280px;
               height: calc(100vh - var(--bar)); overflow: auto; border-right: 1px solid #30363d;
               padding: 8px; background: #0d1117; }
    #sidebar .title { color: #8b949e; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; padding: 6px 6px 8px; }
    .fitem { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer;
             font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: #c9d1d9; }
    .fitem:hover { background: #161b22; }
    .fitem.active { background: #1f2630; }
    .fitem .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
    .fitem .add { color: #3fb950; } .fitem .del { color: #f85149; }
    #files { flex: 1; min-width: 0; padding: 14px; display: flex; flex-direction: column; gap: 18px; }
    #hint { color: #8b949e; font-size: 12.5px; padding: 2px 2px 6px; }
    .file { border: 1px solid #30363d; border-radius: 8px; overflow: hidden; scroll-margin-top: calc(var(--bar) + 8px);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; line-height: 1.5; }
    #send { position: fixed; right: 16px; bottom: 16px; z-index: 9999; padding: 10px 14px; border: none;
            border-radius: 8px; background: #2f81f7; color: #fff; font: 600 13px system-ui; cursor: pointer;
            box-shadow: 0 2px 10px rgba(0,0,0,.4); }
    #send:disabled { opacity: .6; }
    #status { position: fixed; right: 16px; bottom: 56px; z-index: 9999; display: none;
              font: 12px system-ui; color: #9aa; background: rgba(0,0,0,.5); padding: 3px 8px; border-radius: 4px; }
    .pad { padding: 14px; color: #8b949e; }
    .fhdr { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #161b22;
            border-bottom: 1px solid #30363d; cursor: pointer; user-select: none; }
    .file.collapsed .fhdr { border-bottom: none; }
    .fhdr .chev { color: #8b949e; width: 12px; font-size: 11px; flex: 0 0 12px; }
    .fhname { flex: 1; font: 600 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; color: #e6edf3;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .fhcnt { font: 600 11px ui-monospace, monospace; }
    .fhcnt .add { color: #3fb950; } .fhcnt .del { color: #f85149; }
    .vlabel { display: flex; align-items: center; gap: 5px; cursor: pointer; color: #8b949e; font-size: 12px; }
    .vlabel input { cursor: pointer; }
    .file.viewed .fhdr { opacity: .5; }
    .file.viewed .fhname { text-decoration: line-through; }
    .fitem.viewed { opacity: .5; }
    .fitem.viewed .nm { text-decoration: line-through; }
    .frepo { margin: 10px 4px 3px; padding-top: 6px; border-top: 1px solid #21262d; font: 700 11px ui-monospace, monospace;
             color: #58a6ff; letter-spacing: .02em; }
    .frepo:first-of-type { border-top: none; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="bar">
    <h1>pierre-review</h1>
    <span id="meta"></span>
    <span class="sp"></span>
    <button id="toggle">Unified</button>
  </div>
  <div id="layout">
    <aside id="sidebar"><div class="title">Files changed</div></aside>
    <main id="files"><div class="pad">loading diff…</div></main>
  </div>
  <button id="send">▶ Send to agent</button>
  <div id="status"></div>
  <script type="module" src="/dist/main.js"></script>
</body>
</html>
